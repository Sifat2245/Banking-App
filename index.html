<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5.0.0-beta.8/daisyui.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Payoo Mobile Banking</title>
</head>
<body class="bg-slate-800">
    <section class="max-w-md min-h-screen mx-auto py-5 bg-gray-100">
        <div class="flex justify-center items-center mt-52 relative w-9/12 mx-auto">
            <img class="w-80 absolute mix-blend-multiply" src="./assets/bg.png" alt="">
            <img class="w-20 pb-40 z-10" src="./assets/Group.png" alt="">
        </div>

        <div class="hero absolute top-80 left-1">
              <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl rounded-2xl">
                <form class="card-body">
                  <fieldset class="fieldset">
                    <label class="fieldset-label font-bold text-[16px]">Mobile Number</label>
                    <input id="account-number" type="number" class="input rounded-2xl bg-gray-100 border-none" placeholder="Enter your number" required/>
                    <label class="fieldset-label font-bold text-[16px]">4 Digit Pin</label>
                    <input id="pin" type="number" class="input rounded-2xl bg-gray-100 border-none" placeholder="Enter 4 Digit Pin" required/>
                    <div><a class="link link-hover">Forgot password?</a></div>
                    <button id="login-btn" class="btn btn-neutral mt-4 rounded-3xl bg-[#0874F2] border-none">Login</button>
                  </fieldset>
                </form>
              </div>
            </div>
          </div>
    </section>


<script src="./script/login.js"></script>
</body>

</html>
