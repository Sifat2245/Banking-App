<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Payoo</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5.0.0-beta.8/daisyui.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-200">
    <section class= "mx-auto py-5 bg-white rounded-b-2xl">
        <nav class="border-gray-300 border-b-1 mb-8">
            <div class="flex justify-around mb-6">
                <img class="w-14 h-14" src="./assets/Group.png" alt="">
                <div class="pr-24">
                    <h1 class="text-2xl font-bold">৳ 1500</h1>
                    <p class="text-gray-500">Available Balance</p>
                </div>
                <button class="bg-white w-24 h-12 rounded-2xl border-1">Logout</button>
            </div>
        </nav>
        <div class="w-11/12 mx-auto mb-4">
            <h1 class="text-2xl mb-5 font-bold">🔥 Welcome to Payooo!</h1>
            <p>Enjoy easy and convenient financial services with us. Cashout charge is low and </p>
            <!-- card container -->
            <div class="grid grid-cols-3 gap-4 mt-10">
                <!-- cards -->
                <div class="border p-4 text-center rounded-xl">
                    <img class="w-8 mx-auto mb-2" src="./assets/wallet1.png" alt="">
                    <h2>Add Money</h2>
                </div>
                <div class="border p-4 text-center rounded-xl">
                    <img class="w-8 mx-auto mb-2" src="./assets/send1.png" alt="">
                    <h2>Cashout</h2>
                </div>
                <div class="border py-4 text-center rounded-xl">
                    <img class="w-8 mx-auto mb-2" src="./assets/money1.png" alt="">
                    <h2>Transfer Money</h2>
                </div>
                <div class="border p-4 text-center rounded-xl">
                    <img class="w-8 mx-auto mb-2" src="./assets/bonus1.png" alt="">
                    <h2>Get Bonus</h2>
                </div>
                <div class="border p-4 text-center rounded-xl">
                    <img class="w-8 mx-auto mb-2" src="./assets/wallet1.png" alt="">
                    <h2>Pay Bill</h2>
                </div>
                <div class="border p-4 text-center rounded-xl">
                    <img class="w-8 mx-auto mb-2" src="./assets/transaction1.png" alt="">
                    <h2>Transaction</h2>
                </div>
            </div>
        </div>
    </section>

    <section class="min-h-screen mx-auto py-5 bg-gray-200 mt-8">
        <h1 class=" ml-4 text-2xl font-bold mb-12">Add Money</h1>

        <div class="hero">
            <div class="card bg-base-100 w-11/12 rounded-2xl">
              <form class="card-body">
                <fieldset class="fieldset">
                    <label class="fieldset-label font-bold text-[16px]">Select A Bank</label>
                    <select class="select rounded-2xl w-full">
                        <option disabled selected>Select Bank</option>
                        <option>Prime Bank</option>
                        <option>Janata Bank</option>
                        <option>Pubali Bank</option>
                        <option>Brac Bank</option>
                        <option>DBBL</option>
                      </select>
                  <label class="fieldset-label font-bold text-[16px]">Bank Account Number</label>
                  <input id="account-number" type="number" class="input rounded-2xl bg-gray-100 border-none w-full" placeholder="Enter 11 Digit Account Number" required/>
                  <label class="fieldset-label font-bold text-[16px]">Amount to add</label>
                  <input id="pin" type="number" class="input rounded-2xl bg-gray-100 border-none w-full" placeholder="Add amount to withdraw" required/>
                  <label class="fieldset-label font-bold text-[16px]">Pin Number</label>
                  <input id="pin" type="number" class="input rounded-2xl bg-gray-100 border-none w-full" placeholder="Enter 4 Digit pin number" required/>
    
                  <button id="login-btn" class="btn btn-neutral mt-4 rounded-3xl bg-[#0874F2] border-none shadow-none">Add Money</button>
                </fieldset>
              </form>
            </div>
          </div>
        </div>
    </section>
</body>

</html>
